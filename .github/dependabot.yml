# Phase C — automated dependency updates.
# npm, weekly: opens PRs for outdated/vulnerable packages. CI (including
# the `npm audit --audit-level=high` gate) must pass before merge.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
